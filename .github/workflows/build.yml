name: CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: switch xcode
      run: sudo xcode-select -s '/Applications/Xcode_15.0.app/Contents/Developer'

    - name: use cache
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: BlinkTests
      run: |
        set -o pipefail
        xcodebuild \
          -project Blink.xcodeproj \
          -scheme BlinkTests \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPad Air (5th generation)' \
          test | xcpretty

    - name: build archive
      run: |
        set -o pipefail
        xcodebuild archive \
          -project Blink.xcodeproj \
          -scheme Blink \
          -sdk iphoneos \
          -configuration Debug \
          -archivePath "$RUNNER_TEMP/Blink.xcarchive" \
          -destination "generic/platform=iOS" \
          IPHONEOS_DEPLOYMENT_TARGET='16.1' \
          CODE_SIGN_IDENTITY='' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO | tee build.log | xcpretty

    - name: generate unsigned debug ipa
      run: |
        mkdir -p "$RUNNER_TEMP/Payload"
        cp -r "$RUNNER_TEMP/Blink.xcarchive/Products/Applications/Blink.app" \
              "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP"
        zip -r Blink.ipa Payload

    - name: upload ipa
      uses: actions/upload-artifact@v4
      with:
        name: BlinkShell
        path: ${{ runner.temp }}/Blink.ipa
